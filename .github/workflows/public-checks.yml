# Generated by the public release publisher. Publication happens in GitLab.
name: Public source checks

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli-bookworm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    env:
      COMPOSER_ALLOW_SUPERUSER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Composer
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git unzip
          curl --fail --silent --show-error https://getcomposer.org/download/2.10.3/composer.phar --output /tmp/composer.phar
          echo "7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6  /tmp/composer.phar" | sha256sum --check
      - run: php /tmp/composer.phar validate --strict
      - run: php /tmp/composer.phar install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
      - run: php /tmp/composer.phar check
